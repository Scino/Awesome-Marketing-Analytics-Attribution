<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    
    /* Flow Animations */
    .journey-path {
      stroke-dasharray: 8 12;
      animation: dashFlow 25s linear infinite;
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }

    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }

    .float-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .float-card-rev {
      animation: floatRev 7s ease-in-out infinite alternate;
    }
    @keyframes floatRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(10px); }
    }

    .pill-pulse {
      animation: pillFade 3s ease-in-out infinite alternate;
    }
    @keyframes pillFade {
      0% { opacity: 0.75; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg"/>

  <!-- Background Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="150" cy="80" r="160" fill="url(#glowGrad1)" class="pulse-glow" />
  <circle cx="1080" cy="280" r="180" fill="url(#glowGrad2)" class="pulse-glow" />

  <!-- Attribution Multi-Touch Dynamic Journey Flow (Background / Side elements) -->
  <g opacity="0.65">
    <!-- Curved multi-touch journey streams -->
    <path d="M 50,300 C 250,320 280,240 450,260 S 800,340 1150,220" fill="none" stroke="#00f2fe" stroke-width="2.5" class="journey-path" opacity="0.4"/>
    <path d="M 50,80 C 300,40 500,120 750,70 S 1000,140 1150,90" fill="none" stroke="#7b2ff7" stroke-width="2" class="journey-path" opacity="0.35"/>
    <path d="M 100,200 C 400,280 700,100 1100,260" fill="none" stroke="#ff007f" stroke-width="1.8" class="journey-path" opacity="0.3"/>
  </g>

  <!-- Interactive/Dynamic Glass Cards on the Sides (Behind/Beside Title, Non-Obstructive) -->
  <!-- Left Side Floating Card: MMM & Attribution Engine -->
  <g class="float-card" filter="url(#cardShadow)">
    <rect x="50" y="90" width="180" height="95" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
    <text x="65" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">MULTI-TOUCH (MTA)</text>
    <text x="65" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Markov &amp; Shapley</text>
    <!-- Visual Progress / Saturation curve bars -->
    <rect x="65" y="152" width="70" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="65" y="152" width="55" height="5" rx="2.5" fill="#00f2fe"/>
    <rect x="65" y="163" width="130" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="65" y="163" width="95" height="5" rx="2.5" fill="#7b2ff7"/>
  </g>

  <g class="float-card-rev" filter="url(#cardShadow)">
    <rect x="65" y="210" width="160" height="75" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
    <text x="80" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a855f7" letter-spacing="1">INCREMENTALITY</text>
    <text x="80" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Causal Lift + MMM</text>
    <circle cx="195" cy="245" r="9" fill="#22c55e" fill-opacity="0.2"/>
    <circle cx="195" cy="245" r="4.5" fill="#22c55e"/>
  </g>

  <!-- Right Side Floating Card: ROAS & Attribution ROI -->
  <g class="float-card-rev" filter="url(#cardShadow)">
    <rect x="970" y="85" width="180" height="95" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
    <text x="985" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">BUDGET OPTIMIZATION</text>
    <text x="985" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Bayesian Adstock</text>
    <!-- Mini SVG Sparkline Chart -->
    <path d="M 985,163 Q 1010,150 1030,158 T 1070,143 T 1120,138" fill="none" stroke="#38bdf8" stroke-width="2.2" filter="url(#glow)"/>
  </g>

  <g class="float-card" filter="url(#cardShadow)">
    <rect x="985" y="205" width="165" height="80" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.2"/>
    <text x="1000" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ec4899" letter-spacing="1">EVENT PIPELINE</text>
    <text x="1000" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Clickstream &amp; CRM</text>
    <rect x="1000" y="264" width="110" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="1000" y="264" width="85" height="5" rx="2.5" fill="#ec4899"/>
  </g>

  <!-- Center Content: Clear Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Top Category Pill Tag -->
    <g class="pill-pulse">
      <rect x="470" y="45" width="260" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="url(#accentGrad)" stroke-width="1.5"/>
      <text x="600" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Never obscured) -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Marketing Analytics &amp; Attribution
    </text>

    <!-- Gradient Subtitle / Tagline -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.2">
      Multi-Touch Attribution (MTA) &bull; Marketing Mix Modeling (MMM) &bull; First-Party Measurement
    </text>

    <!-- Description Lines -->
    <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Top SaaS Platforms &amp; Open-Source Engines for Data-Driven Marketers &amp; Revenue Engineers
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(325, 275)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1"/>
      <text x="80" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🎯 Multi-Touch (MTA)</text>

      <rect x="175" y="0" width="190" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1"/>
      <text x="270" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">📊 Marketing Mix (MMM)</text>

      <rect x="380" y="0" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1"/>
      <text x="465" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">⚡ Real-Time Ingestion</text>
    </g>
  </g>
</svg>